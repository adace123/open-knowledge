name: Update OpenKnowledge pin
on:
  schedule:
    # Sunday, ahead of this repo's Monday Dependabot run.
    - cron: "0 12 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          flakehub: false
      - name: Update pin
        run: ./scripts/update-pin.sh
      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet -- nix/pins.json; then
            echo "no update"
            exit 0
          fi
          version=$(jq -r .version nix/pins.json)
          git config user.name "open-knowledge-updater"
          git config user.email "open-knowledge-updater@users.noreply.github.com"
          git add nix/pins.json
          git commit -m "chore(deps): bump @inkeep/open-knowledge to ${version}"
          git push
